<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>사진 설명 사용성 확인 · __APP_NAME__</title>
</head>
<body>
  <main class="explanation-preview">
    <header><p>샘플 화면입니다 · 가상 기록만 사용하며 분석·계정 저장은 하지 않아요.</p><h1>사진을 보고, 다음 행동까지</h1></header>
    <fieldset class="preview-scenarios"><legend>상황 선택</legend>
      <label><input type="radio" name="scenario" value="recorded" checked> 기록 있음</label>
      <label><input type="radio" name="scenario" value="empty"> 기록 없음</label>
      <label><input type="radio" name="scenario" value="discomfort"> 불편함 있음</label>
      <label><input type="radio" name="scenario" value="failed"> 결과 해석 실패</label>
    </fieldset>
    <div id="guidance-preview"></div>
    <section class="preview-questions"><h2>화면을 본 뒤 답해 주세요</h2><ol><li>오늘 무엇을 하실 건가요?</li><li>제안은 사진과 직접 입력한 기록 중 무엇을 근거로 했나요?</li><li>이 화면만 보고 알 수 없는 것은 무엇인가요?</li></ol><p>답변은 이 화면에서 수집·저장하지 않아요. 진행자가 별도로 메모해 주세요.</p></section>
  </main>
  <script type="module" src="./사진설명.js"></script>
</body>
</html>
